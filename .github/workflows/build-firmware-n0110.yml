name: Firmware N0110 (Renode)
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Source repository
        default: numworks/epsilon
        required: true
      ref:
        description: Source tag, branch or commit
        default: '15.5.0'
        required: true
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick libfreetype6-dev libjpeg-dev libpng-dev pkg-config python3
      - name: Install ARM toolchain
        uses: numworks/setup-arm-toolchain@2020-q2
      - name: Build onboarding firmware
        run: make -j2 epsilon.onboarding.dfu
      - name: Build standard firmware
        run: make -j2 epsilon.dfu
      - name: Extract firmware images and record source revision
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
        run: |
          mkdir -p fw
          cat > split_dfu.py <<'PY'
          import json, os, pathlib, struct, subprocess
          out = pathlib.Path('fw')
          for target in ('epsilon.onboarding', 'epsilon'):
              path = next(pathlib.Path('output').rglob(target + '.dfu'))
              data = path.read_bytes()
              assert data[:5] == b'DfuSe', 'Invalid DFU signature'
              (out / path.name).write_bytes(data)
              offset = 11
              found = set()
              for _ in range(data[10]):
                  assert data[offset:offset+6] == b'Target', 'Invalid target header'
                  count = struct.unpack_from('<I', data, offset + 270)[0]
                  offset += 274
                  for _ in range(count):
                      address, size = struct.unpack_from('<II', data, offset)
                      offset += 8
                      blob = data[offset:offset+size]
                      assert len(blob) == size, 'Truncated element'
                      offset += size
                      suffix = {0x08000000: 'internal', 0x90000000: 'external'}.get(address, 'segment_%08X' % address)
                      (out / (target + '.' + suffix + '.bin')).write_bytes(blob)
                      found.add(address)
                      print(target, suffix, hex(address), size)
              assert {0x08000000, 0x90000000} <= found, 'Missing firmware image'
          for path in pathlib.Path('output').rglob('epsilon*.elf'):
              (out / path.name).write_bytes(path.read_bytes())
          for path in pathlib.Path('.').glob('LICENSE*'):
              if path.is_file():
                  (out / path.name).write_bytes(path.read_bytes())
          (out / 'source.json').write_text(json.dumps({'repository': os.environ['SOURCE_REPOSITORY'], 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'submodules': subprocess.check_output(['git', 'submodule', 'status', '--recursive'], text=True)}, indent=2) + '\n')
          PY
          python3 split_dfu.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-n0110-renode
          path: fw/*
          if-no-files-found: error